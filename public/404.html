<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AlanSM Solutions</title>
    <script type="text/javascript">
      // GitHub Pages SPA Single Page App redirect
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      
      // If someone goes directly to /referral or /ref
      if (path.indexOf('/referral') !== -1 || path.indexOf('/ref') !== -1) {
        window.location.replace('/referral.html' + search + hash);
      } else {
        // Fallback redirect to index.html
        window.location.replace('/' + (search ? search : '') + (hash ? hash : ''));
      }
    </script>
  </head>
  <body>
    <p>Redirecting to AlanSM Solutions...</p>
  </body>
</html>
